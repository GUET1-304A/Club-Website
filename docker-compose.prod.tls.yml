services:
  frontend:
    # Probe a loopback-only listener; public HTTPS is independently verified by
    # release.py with normal certificate/hostname validation.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./investment-relay:/run/investment:ro
      - ./airi-relay:/run/airi:ro
