services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # 网络受限时在 .env 里设置 PIP_INDEX_URL（如清华/阿里云 PyPI 镜像）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: xingyu-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app          # hot-reload on code changes
      - db_data:/app/data       # persist SQLite DB (optional, adjust path)
      - upload_data:/app/uploads
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a unique high-entropy value before starting Compose.}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a unique high-entropy value before starting Compose.}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/xingyu_cms.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-/app/uploads}
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_PROVIDER: ${OSS_PROVIDER:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_PREFIX: ${OSS_PREFIX:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_PROVIDER: ${OCR_PROVIDER:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_ENDPOINT: ${OCR_ENDPOINT:-}
      OCR_MODEL: ${OCR_MODEL:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      QQ_LOGIN_ENABLED: ${QQ_LOGIN_ENABLED:-false}
      QQ_APP_ID: ${QQ_APP_ID:-}
      QQ_APP_KEY: ${QQ_APP_KEY:-}
      QQ_REDIRECT_URI: ${QQ_REDIRECT_URI:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: xingyu-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontendnew/src:/app/src   # hot-reload source
      - ./frontendnew/public:/app/public
      - ./frontendnew/index.html:/app/index.html
      - ./frontendnew/vite.config.ts:/app/vite.config.ts
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://backend:5000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  upload_data:
