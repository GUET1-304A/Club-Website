# Container readiness must not follow the public HTTP-to-HTTPS redirect.
# This listener is accessible only inside the frontend container.
server {
    listen 127.0.0.1:8080;
    location = /health/ready { include /etc/nginx/frontend-proxy.inc; }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name 304aistudio.cn www.304aistudio.cn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 304aistudio.cn www.304aistudio.cn;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查：后端端点在 /health（不带 /api 前缀），单独透出便于外部探活
    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Delivery manifest contains the app template; it is for Flask only.
    location = /metadata.json { return 404; }
    location ~ /\. { return 404; }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /sitemap.xml { include /etc/nginx/frontend-proxy.inc; }
    location = /robots.txt { include /etc/nginx/frontend-proxy.inc; }

    # Slugs may contain dots; detail routes still need the publication check.
    location ~ ^/(project|award|blog)/ { include /etc/nginx/frontend-proxy.inc; }

    # Missing assets must never receive the SPA shell with status 200.
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|mp4|webm|pdf|txt|xml)$ {
        try_files $uri =404;
    }

    location / { include /etc/nginx/frontend-proxy.inc; }
}
