# Container readiness must not follow the public HTTP-to-HTTPS redirect.
# This listener is accessible only inside the frontend container.
server {
    listen 127.0.0.1:8080;
    location = /health/ready { include /etc/nginx/frontend-proxy.inc; }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name 304aistudio.cn www.304aistudio.cn investment.304aistudio.cn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;
    return 308 https://$host$request_uri;
}

# Keep the demonstration's cookies, API and static assets on their own origin.
# The Unix socket is opened by a restricted SSH reverse tunnel from the desktop;
# no additional TCP application port is published on the server.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name investment.304aistudio.cn;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /api/docs { return 404; }
    location = /openapi.json { return 404; }

    location / {
        proxy_pass http://unix:/run/investment/relay.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $investment_connection_upgrade;
        proxy_cookie_flags gig_session secure httponly samesite=strict;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_intercept_errors on;
        error_page 502 504 =503 /__investment_offline;
    }

    location = /__investment_offline {
        internal;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control no-store always;
        add_header Retry-After 30 always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投资管理系统暂时离线</title><body style="margin:0;background:#f5f2ed;color:#143f46;font:16px/1.8 sans-serif"><main style="max-width:520px;margin:18vh auto;padding:32px"><h1 style="font-size:28px">演示服务暂时离线</h1><p>投资管理系统当前未连接，请稍后重试，或联系演示负责人。</p><p><a href="/" style="color:inherit">重新连接</a> · <a href="https://304aistudio.cn/projects" style="color:inherit">返回作品画廊</a></p></main></body></html>';
    }
}

map $http_upgrade $investment_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 304aistudio.cn www.304aistudio.cn;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查：后端端点在 /health（不带 /api 前缀），单独透出便于外部探活
    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Delivery manifest contains the app template; it is for Flask only.
    location = /metadata.json { return 404; }
    location ~ /\. { return 404; }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /sitemap.xml { include /etc/nginx/frontend-proxy.inc; }
    location = /robots.txt { include /etc/nginx/frontend-proxy.inc; }

    # Slugs may contain dots; detail routes still need the publication check.
    location ~ ^/(project|award|blog)/ { include /etc/nginx/frontend-proxy.inc; }

    # Missing assets must never receive the SPA shell with status 200.
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|mp4|webm|pdf|txt|xml)$ {
        try_files $uri =404;
    }

    location / { include /etc/nginx/frontend-proxy.inc; }
}
