<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://shetuanweb.oss-cn-wulanchabu.aliyuncs.com/images/5ab0547bffef4a0986baac8e245c4401.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星雨作坊 — Xingyu Studio</title>
    <meta name="description" content="星雨作坊是一个由学生自主运营的开发社团。我们围绕真实项目进行学习、共创和开源。" />
    <link rel="canonical" href="https://304aistudio.cn/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://304aistudio.cn/" />
    <meta property="og:title" content="星雨作坊 — Xingyu Studio" />
    <meta property="og:description" content="星雨作坊是一个由学生自主运营的开发社团。我们围绕真实项目进行学习、共创和开源。" />
    <meta property="og:image" content="https://shetuanweb.oss-cn-wulanchabu.aliyuncs.com/images/5ab0547bffef4a0986baac8e245c4401.png" />
    <meta name="theme-color" content="#f5f2ed" />
    <script>
      let theme = null
      try { theme = localStorage.getItem('xingyu-theme') } catch { /* Storage may be unavailable. */ }
      const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
      if (dark) document.querySelector('meta[name="theme-color"]').content = '#0a0f14'
    </script>
    <!--
      字体全部本地化，无任何外部字体依赖：
      - 正文西文 Inter（self-hosted, OFL）
      - 等宽 JetBrains Mono（self-hosted, OFL）
      - 中文展示字 Smiley Sans / ZCOOL QingKe HuangYou（self-hosted, OFL）
      字体栈定义见 src/index.css，文件在 public/fonts/。
    -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/smiley-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/zcool-qingke-huangyou.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
